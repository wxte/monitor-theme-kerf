<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" />
    <!-- fixed path, not hashed: the hub swaps it when the operator uploads an icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/kerf.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <!-- the data, requested alongside the script rather than after it runs -->
    <link rel="preload" href="/api/me" as="fetch" crossorigin />
    <link rel="preload" href="/api/themes/__SHORT__/config" as="fetch" crossorigin />
    <link rel="preload" href="/api/nodes" as="fetch" crossorigin fetchpriority="low" />
    <title>Monitor</title>
    <script>
      // the visitor's own light/dark choice, applied before first paint
      try {
        var t = localStorage.getItem("kerf-theme")
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div id="app"><div class="loading">正在连接</div></div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
